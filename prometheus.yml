global:
    scrape_interval: 5s

scrape_configs:
   - job_name: "otel-collector"
     static_configs:
       - targets: ["otel-collector:9464"]
   - job_name: "ordering-api"
     static_configs:
       - targets: ["ordering-api:80"]  # Adjust the port if needed
     metrics_path: "/metrics"  # This is the default path for OpenTelemetry Prometheus scraping